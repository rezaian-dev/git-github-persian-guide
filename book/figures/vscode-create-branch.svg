<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520">
  <rect width="1100" height="520" rx="18" fill="#020617"/>
  <rect x="20" y="20" width="1060" height="480" rx="14" fill="#0f172a"/>
  <rect x="180" y="70" width="740" height="380" rx="14" fill="#1e293b" stroke="#f97316" stroke-width="2"/>
  <text x="550" y="110" text-anchor="middle" fill="#e2e8f0" font-family="DejaVu Sans, sans-serif" font-size="16" font-weight="700">Command Palette  ·  Ctrl+Shift+P</text>
  <rect x="210" y="130" width="680" height="40" rx="8" fill="#0f172a" stroke="#475569"/>
  <text x="226" y="156" fill="#fdba74" font-family="DejaVu Sans Mono, monospace" font-size="14">Git: Create Branch from...</text>
  <text x="226" y="200" fill="#94a3b8" font-family="DejaVu Sans, sans-serif" font-size="13">Select a ref to create the branch from</text>
  <rect x="210" y="216" width="680" height="36" rx="8" fill="#ea580c"/>
  <text x="226" y="239" fill="#fff" font-family="DejaVu Sans Mono, monospace" font-size="13">main</text>
  <text x="226" y="278" fill="#7dd3fc" font-family="DejaVu Sans Mono, monospace" font-size="13">origin/main</text>
  <text x="226" y="310" fill="#86efac" font-family="DejaVu Sans Mono, monospace" font-size="13">HEAD</text>
  <rect x="210" y="336" width="680" height="40" rx="8" fill="#0f172a" stroke="#334155"/>
  <text x="226" y="362" fill="#e2e8f0" font-family="DejaVu Sans Mono, monospace" font-size="14">feat/auth</text>
  <text x="550" y="420" text-anchor="middle" fill="#94a3b8" font-family="DejaVu Sans, sans-serif" font-size="12">then press Enter  ·  equivalent to git switch -c feat/auth</text>
</svg>
